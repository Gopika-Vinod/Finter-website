apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-website
  labels:
    app: demo-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-website
  template:
    metadata:
      labels:
        app: demo-website
    spec:
      containers:
        - name: demo-website
          image: 905418383753.dkr.ecr.ap-south-1.amazonaws.com/demo-website:latest
          ports:
            - containerPort: 80
